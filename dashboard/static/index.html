</head>
<body>
<header class="top">

    <span class="brand-name">交易看板</span>

    <span>模型配置</span>

</header>
<main id="main" tabindex="-1"></main>
<footer class="foot">
  这里的每一句话都是当时记录下来的原话，界面不改写、不翻译、不补充。模拟交易，不涉及真实资金，不构成投资建议。

<div id="tooltip" class="tooltip" role="status" hidden></div>
