<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>交易看板</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true">
      <ellipse class="mark-table" cx="13" cy="13" rx="6.5" ry="4"/>
      <circle cx="13" cy="3.6" r="2"/><circle cx="21.4" cy="8.2" r="2"/><circle cx="21.4" cy="17.8" r="2"/>
      <circle cx="13" cy="22.4" r="2"/><circle cx="4.6" cy="17.8" r="2"/><circle cx="4.6" cy="8.2" r="2"/>
    </svg>
    <span class="brand-name">交易看板</span>
    <span class="chip chip-quiet" title="这个页面只显示记录。它不能下单，不能改风控参数，也不能启动运行。">只读</span>
    <span class="chip chip-quiet">模拟盘</span>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面"></nav>
  <label class="arm-pick">
    <span>模型配置</span>
    <select id="arm"></select>
  </label>
  <button type="button" id="lang" class="lang-pick"></button>
</header>
<main id="main" tabindex="-1"></main>
<footer class="foot">
  这里的每一句话都是当时记录下来的原话，界面不改写、不翻译、不补充。模拟交易，不涉及真实资金，不构成投资建议。
</footer>
<div id="tooltip" class="tooltip" role="status" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
